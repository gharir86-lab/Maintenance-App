<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2326">
<title>Maintenance Register</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#E6E8E6; --panel:#fff; --plate:#1A2124; --ink:#101618; --sub:#5E6A70;
  --line:#CFD5D0; --accent:#0F5C6B; --rust:#B4400F; --ok:#2E7D4F; --amber:#8F6300;
  --shadow:0 1px 2px rgba(16,22,24,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.bar{background:var(--plate);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.bar h1{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.bar .sub{color:#8FA3A9}
.wrap{padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .06s ease}
.card:active{transform:scale(.995)}
.pad{padding:12px}
.lbl,.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.hdr{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.hdr .t{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.hdr .ln{flex:1;height:1px;background:var(--line)}
.mono{font-family:var(--mono);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.stripe{width:6px;border-radius:3px 0 0 3px;flex-shrink:0}
.hazard{background:repeating-linear-gradient(135deg,var(--rust) 0 6px,var(--plate) 6px 12px)}
.name{font-weight:600;font-size:14px}
.big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
button{font-family:inherit}
.btn{padding:12px 15px;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;
  justify-content:center;gap:6px;min-height:42px;transition:transform .06s ease}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dark{background:var(--plate);color:#fff;border-color:var(--plate)}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.btn.full{width:100%}
.chip{padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
.chip.on{background:var(--plate);color:#fff;border-color:var(--plate)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid currentColor}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.field{margin-bottom:12px}
.sect{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.sect .rule{flex:1;height:1px;background:var(--line)}
.sect .nm{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--plate);display:flex;
  border-top:3px solid var(--accent);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:#8A979C;padding:10px 0 13px;display:flex;
  border-top:3px solid transparent;margin-top:-3px;
  flex-direction:column;align-items:center;gap:3px;font-size:9px;font-family:var(--mono);
  letter-spacing:.06em;cursor:pointer}
nav button.on{color:#fff;border-top-color:#5FB0C0}
.scrim{position:fixed;inset:0;background:rgba(18,24,26,.55);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-top:4px solid var(--accent)}
.empty{padding:26px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.55}
.chk{display:flex;gap:11px;padding:12px;border-bottom:1px solid var(--line);align-items:flex-start}
.chk:last-child{border-bottom:none}
.box{min-width:30px;height:30px;border-radius:5px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;flex-shrink:0}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box.crit{border-color:var(--rust)}
.box.crit.on{background:var(--rust);border-color:var(--rust)}
.sres{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.sres:last-child{border-bottom:none}
.warn{background:#FFF4E0;border:1px solid var(--amber);color:var(--amber);padding:10px 12px;
  font-size:12px;border-radius:3px;margin-bottom:12px}
svg{flex-shrink:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:74px;height:74px;border-radius:3px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:#fff}
.lightbox{position:fixed;inset:0;background:rgba(10,14,15,.94);z-index:80;display:flex;flex-direction:column}
.lightbox img{flex:1;object-fit:contain;min-height:0;width:100%}
.lbbar{display:flex;gap:8px;padding:12px;justify-content:space-between;align-items:center}
.toast{position:fixed;left:12px;right:12px;bottom:96px;background:var(--plate);color:#fff;
  padding:12px 14px;border-radius:4px;z-index:90;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.scanbar{background:#0F5C6B;color:#fff;padding:10px 12px;border-radius:3px;margin-bottom:12px;font-size:13px}
.scanbar .mono{color:#BFE3EA}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
video{width:100%;background:#000;border-radius:3px}
.rthumb{width:54px;height:54px;object-fit:cover;border-radius:3px;margin:12px 0 12px 12px;
  border:1px solid var(--line);background:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tile{flex:1 1 44%;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:12px 10px;cursor:pointer}
.late{color:var(--rust);font-weight:700}
.donerow{opacity:.55}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.favcard{min-width:136px;max-width:136px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:10px;cursor:pointer}
.star{background:none;border:none;padding:6px;cursor:pointer;color:var(--line)}
.star.on{color:#D9A400}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------ data */
var KEY='maint_v1';
var DB={sectors:[],groups:[],assets:[],comps:[],wos:[],drs:[],pms:[],parts:[],rems:[],projects:[],meta:{}};
var UI={tab:'home',view:null,sheet:null,draft:null,filter:'open',q:'',armed:null,noStore:false};

function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw);
    DB={sectors:o.sectors||[],groups:o.groups||[],assets:o.assets||[],comps:o.comps||[],wos:o.wos||[],drs:o.drs||[],pms:o.pms||[],parts:o.parts||[],rems:o.rems||[],projects:o.projects||[],meta:o.meta||{}}; } }
  catch(e){ UI.noStore=true; }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); UI.noStore=false; }
  catch(e){ UI.noStore=true; toast('SAVE FAILED - storage is full. Take a backup now, then delete old photos.'); }
  render();
}

var SECTOR_COLORS=['#0F5C6B','#B4400F','#2E7D4F','#9A6B00','#3B4E8C','#6B3D6B','#1E7A78','#4A5A62'];
var UNIT_ICONS=[{k:'box',t:'General'},{k:'engine',t:'Engine'},{k:'power',t:'Electrical'},
  {k:'pump',t:'Pump'},{k:'motor',t:'Motor'},{k:'truck',t:'Vehicle'},{k:'tank',t:'Tank'},
  {k:'comp',t:'Compressor'},{k:'crane',t:'Crane'},{k:'tool',t:'Tooling'}];

/* --------------------------------------------------------------- helpers */
function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
function addDays(d,n){ return new Date(new Date(d).getTime()+n*86400000).toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function asset(id){ return byId(DB.assets,id); }
function sector(id){ return byId(DB.sectors,id); }
function part(id){ return byId(DB.parts,id); }
function comp(id){ return byId(DB.comps,id); }
function group(id){ return byId(DB.groups,id); }
function childrenOf(id){ return DB.assets.filter(function(a){ return a.parentId===id; }); }
function isChild(a){ return !!(a.parentId && byId(DB.assets,a.parentId)); }
function descendants(id,acc){
  acc=acc||{};
  childrenOf(id).forEach(function(c){ if(!acc[c.id]){ acc[c.id]=1; descendants(c.id,acc); } });
  return acc;
}
function unitAlert(a){
  var open=DB.wos.filter(function(w){ return w.assetId===a.id&&w.status==='open'; }).length;
  var late=DB.wos.filter(function(w){ return w.assetId===a.id&&woLate(w); }).length;
  var pmo=DB.pms.filter(function(p){ return p.assetId===a.id; }).some(function(p){ return pmStatus(p,a).overdue; });
  return {open:open,late:late,pm:pmo};
}
function assetsInGroup(gid){ return DB.assets.filter(function(a){ return (a.groupId||'')===gid; }); }
function compsOf(aid){ return DB.comps.filter(function(c){ return c.assetId===aid; }); }
function drsOf(aid){ return DB.drs.filter(function(r){ return r.assetId===aid; })
  .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }); }
function wosOfComp(cid){ return DB.wos.filter(function(w){ return w.compId===cid; }); }
function meterUnit(a){ return a && a.meterType==='km' ? 'km' : 'h'; }
function sectorColor(sec){
  if(!sec) return '#4A5A62';
  if(sec.color) return sec.color;
  var i=0; for(var n=0;n<DB.sectors.length;n++) if(DB.sectors[n].id===sec.id) i=n;
  return SECTOR_COLORS[i%SECTOR_COLORS.length];
}
function nextSectorColor(){ return SECTOR_COLORS[DB.sectors.length%SECTOR_COLORS.length]; }
function statusColor(a){ return a.status==='down'?'#B4400F':a.status==='standby'?'#9A6B00':'#2E7D4F'; }
function unitBadge(a,col,size){
  a=a||{}; col=col||'#4A5A62';
  var sz=size||28;
  return '<span style="display:inline-flex;align-items:center;justify-content:center;width:'+sz+'px;height:'+sz+
    'px;border-radius:4px;background:'+col+'1F;color:'+col+';border:1px solid '+col+'55;flex-shrink:0">'+
    ico(a.icon||'box',Math.round(sz*0.6))+'</span>';
}
function dot(c){ return '<span style="display:inline-block;width:9px;height:9px;border-radius:9px;background:'+c+
  ';margin-right:7px;flex-shrink:0"></span>'; }

function pmStatus(pm,a){
  if(pm.basis==='days'){
    var next=addDays(pm.lastDate||today(),num(pm.every));
    var left=dayDiff(today(),next);
    return {next:next,left:left,unit:'d',overdue:left<0,soon:left>=0&&left<=Math.max(2,num(pm.every)*0.15)};
  }
  var nx=num(pm.lastMeter)+num(pm.every);
  var lf=nx-num(a&&a.meter);
  var u=meterUnit(a);
  return {next:nx+' '+u,left:lf,unit:u,overdue:lf<0,soon:lf>=0&&lf<=num(pm.every)*0.15};
}
function duePms(){
  return DB.pms.map(function(p){ return {pm:p,st:pmStatus(p,asset(p.assetId))}; })
    .filter(function(x){ return x.st.overdue||x.st.soon; })
    .sort(function(a,b){ return a.st.left-b.st.left; });
}
function openWos(){ return DB.wos.filter(function(w){ return w.status==='open'; }); }
function woLate(w){ return w.status==='open' && w.due && dayDiff(today(),w.due)<0; }
function lateWos(){ return DB.wos.filter(woLate); }
function lateDays(w){ return Math.abs(dayDiff(today(),w.due)); }
function activeRems(){ return DB.rems.filter(function(r){ return !r.done; })
  .sort(function(a,b){ return String(a.due).localeCompare(String(b.due)); }); }
function remLeft(r){ return r.due?dayDiff(today(),r.due):999; }
function dueRems(){ return activeRems().filter(function(r){ return remLeft(r)<=3; }); }
function project(id){ return byId(DB.projects,id); }
function projLeft(pr){ return pr.due?dayDiff(today(),pr.due):999; }
function projDone(pr){
  var t=(pr.tasks||[]), i=(pr.items||[]);
  var tot=t.length+i.length; if(!tot) return 0;
  var dn=t.filter(function(x){return x.done;}).length+i.filter(function(x){return x.got;}).length;
  return Math.round(dn/tot*100);
}
function liveProjects(){ return DB.projects.filter(function(p){ return p.status!=='done'; }); }
function dueProjects(){ return liveProjects().filter(function(p){ return p.due && projLeft(p)<=7; })
  .sort(function(a,b){ return projLeft(a)-projLeft(b); }); }
function firstPhoto(o){
  var ids=(o&&o.photos)||[];
  for(var i=0;i<ids.length;i++) if(IMG[ids[i]]) return IMG[ids[i]];
  return null;
}
function thumbOf(o){
  var src=firstPhoto(o);
  return src?'<img class="rthumb" src="'+src+'">':'';
}
function lowParts(){ return DB.parts.filter(function(p){ return num(p.qty)<=num(p.min); }); }

/* ---------------------------------------------------------------- photos */
var IMG={};                 /* id -> dataURL, held in memory */
var IMGP='maint_img_';
var PENDING=null;           /* {target, id, decode} */
var CANQR = (typeof window.BarcodeDetector !== 'undefined');
var CANLIVE = CANQR && window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;

var IDB=null;
function idbOpen(cb){
  try{
    if(!window.indexedDB) return cb();
    var r=indexedDB.open('maint_img',2);
    r.onupgradeneeded=function(){
      try{ if(!r.result.objectStoreNames.contains('img')) r.result.createObjectStore('img'); }catch(e){}
      try{ if(!r.result.objectStoreNames.contains('doc')) r.result.createObjectStore('doc'); }catch(e){}
    };
    r.onsuccess=function(){ IDB=r.result; cb(); };
    r.onerror=function(){ cb(); };
    r.onblocked=function(){ cb(); };
  }catch(e){ cb(); }
}
function idbAll(cb){
  if(!IDB) return cb();
  try{
    var st=IDB.transaction('img','readonly').objectStore('img');
    var req=st.openCursor();
    req.onsuccess=function(){ var c=req.result; if(c){ IMG[c.key]=c.value; c.continue(); } else cb(); };
    req.onerror=function(){ cb(); };
  }catch(e){ cb(); }
}
function idbPut(id,data){
  if(!IDB) return false;
  try{ IDB.transaction('img','readwrite').objectStore('img').put(data,id); return true; }catch(e){ return false; }
}
function idbDel(id){ if(!IDB) return; try{ IDB.transaction('img','readwrite').objectStore('img').delete(id); }catch(e){} }

/* ---- documents: PDFs and drawings, read on demand so they stay out of memory ---- */
function docPut(id,data){
  if(!IDB) return false;
  try{ IDB.transaction('doc','readwrite').objectStore('doc').put(data,id); return true; }catch(e){ return false; }
}
function docGet(id,cb){
  if(!IDB) return cb(null);
  try{
    var rq=IDB.transaction('doc','readonly').objectStore('doc').get(id);
    rq.onsuccess=function(){ cb(rq.result||null); };
    rq.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function docDel(id){ if(!IDB) return; try{ IDB.transaction('doc','readwrite').objectStore('doc').delete(id); }catch(e){} }
function docAll(cb){
  var out={};
  if(!IDB) return cb(out);
  try{
    var rq=IDB.transaction('doc','readonly').objectStore('doc').openCursor();
    rq.onsuccess=function(){ var c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } else cb(out); };
    rq.onerror=function(){ cb(out); };
  }catch(e){ cb(out); }
}
function dataUrlToBlob(d){
  var parts=d.split(','), mime=(/:(.*?);/.exec(parts[0])||[])[1]||'application/octet-stream';
  var bin=atob(parts[1]), n=bin.length, u=new Uint8Array(n);
  while(n--) u[n]=bin.charCodeAt(n);
  return new Blob([u],{type:mime});
}
function openDoc(id){
  docGet(id,function(d){
    if(!d){ toast('That file is missing from storage.'); return; }
    var url=URL.createObjectURL(dataUrlToBlob(d));
    var w=window.open(url,'_blank');
    if(!w) toast('Chrome blocked the window. Allow pop-ups for this site.');
    setTimeout(function(){ URL.revokeObjectURL(url); },120000);
  });
}
function humanSize(b){
  b=b||0;
  return b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
}

/* old photos kept in localStorage get moved across, once */
function migrateImages(){
  var moved=0;
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf(IMGP)===0) keys.push(k); }
    keys.forEach(function(k){
      var id=k.slice(IMGP.length), data=localStorage.getItem(k);
      IMG[id]=data;
      if(IDB && idbPut(id,data)){ localStorage.removeItem(k); moved++; }
    });
  }catch(e){}
  return moved;
}

function loadImages(cb){
  idbOpen(function(){
    idbAll(function(){ migrateImages(); cb(); });
  });
}
function putImage(id,data){
  IMG[id]=data;
  if(IDB && idbPut(id,data)) return true;
  try{ localStorage.setItem(IMGP+id,data); return true; }
  catch(e){ delete IMG[id]; toast('Photo storage is full. Take a backup, then delete some photos.'); return false; }
}
function dropImage(id){ delete IMG[id]; idbDel(id); try{ localStorage.removeItem(IMGP+id); }catch(e){} }
function imgBytes(){ var n=0; for(var k in IMG) n+=IMG[k].length; return n; }

function compress(file,cb,maxPx,qual){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=maxPx||900, s=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      try{ cb(c.toDataURL('image/jpeg',qual||0.6)); }catch(e){ cb(r.result); }
    };
    im.onerror=function(){ cb(r.result); };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

var CANCAM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
var CAMSTREAM=null;

function shoot(target,id,decode){
  PENDING={target:target,id:id,decode:!!decode};
  if(CANCAM){ UI.cam=true; render(); setTimeout(initCam,60); return; }
  pickFile();
}
function pickFile(){ var inp=document.getElementById('cam'); if(inp){ inp.value=''; inp.click(); } }
function pickDoc(assetId){
  PENDING={target:'doc-file',id:assetId};
  var inp=document.getElementById('docin');
  if(inp){ inp.value=''; inp.click(); }
}
function saveDoc(assetId,name,mime,dataUrl){
  if(!IDB){ toast('This browser cannot store documents. Open the app from its web address, not from Downloads.'); return; }
  var id=uid();
  if(!docPut(id,dataUrl)){ toast('Could not store that file.'); return; }
  var a=asset(assetId); if(!a) return;
  a.docs=(a.docs||[]).concat([{id:id,name:name,mime:mime,size:Math.round(dataUrl.length*0.75),added:today()}]);
  save();
  toast('Added: '+name);
}

function initCam(){
  var v=document.getElementById('camvid'); if(!v) return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(st){
    CAMSTREAM=st; v.srcObject=st; v.play();
  }).catch(function(e){
    closeCam();
    toast('In-app camera refused ('+((e&&e.name)||'unknown')+'). Opening the phone camera instead.');
    setTimeout(pickFile,120);
  });
}
function closeCam(){
  if(CAMSTREAM){ CAMSTREAM.getTracks().forEach(function(t){ t.stop(); }); CAMSTREAM=null; }
  UI.cam=false; render();
}
function snap(){
  var v=document.getElementById('camvid'); if(!v||!v.videoWidth) return;
  var max=900, sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
  var c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  var data=c.toDataURL('image/jpeg',0.6);
  if(PENDING&&PENDING.decode&&CANQR){
    try{
      new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']})
        .detect(c).then(function(res){ if(res&&res.length){ UI.code=res[0].rawValue; render(); } }).catch(function(){});
    }catch(e){}
  }
  var wasDoc = PENDING && PENDING.target==='doc-asset', docAid = PENDING && PENDING.id;
  closeCam();
  if(wasDoc){ saveDoc(docAid,'Drawing '+today()+'.jpg','image/jpeg',data); return; }
  var pid=uid();

}

function attachPhoto(pid){
  var t=PENDING||{};
  if(t.target==='asset'){ var a=asset(t.id); if(a){ a.photos=(a.photos||[]).concat([pid]); } save(); }
  else if(t.target==='proj'){ var pz=project(t.id); if(pz){ pz.photos=(pz.photos||[]).concat([pid]); } save(); }
  else if(t.target==='comp'){ var cx=comp(t.id); if(cx){ cx.photos=(cx.photos||[]).concat([pid]); } save(); }
  else if(t.target==='draft-comp'){ UI.draft=currentCompDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else if(t.target==='draft-dr'){ UI.draft=currentDrDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else if(t.target==='wo'){ var w=byId(DB.wos,t.id); if(w){ w.photos=(w.photos||[]).concat([pid]); } save(); }
  else if(t.target==='draft-asset'){ UI.draft=currentAssetDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else if(t.target==='draft-wo'){ UI.draft=currentWoDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else render();
}

function readCode(file){
  if(!CANQR) return;
  try{
    var det=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']});
    createImageBitmap(file).then(function(bmp){
      return det.detect(bmp);
    }).then(function(res){
      if(res && res.length){ UI.code=res[0].rawValue; render(); }
      else toast('No code found in that photo. Fill the frame with the label and try again.');
    }).catch(function(){});

    UI.draft=currentAssetDraft(); UI.draft[where]=txt; UI.code=null; render(); return;
  }

}

/* live scanner (needs https) */
var STREAM=null,SCANLOOP=null;
function startScan(){
  UI.scan=true; render();
  setTimeout(function(){
    var v=document.getElementById('vid'); if(!v) return;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
      STREAM=st; v.srcObject=st; v.play();
      var det=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']});
      SCANLOOP=setInterval(function(){
        det.detect(v).then(function(res){
          if(res&&res.length){ var t=res[0].rawValue; stopScan(); matchUnit(t); }
        }).catch(function(){});
      },400);
    }).catch(function(){ stopScan(); toast('Camera blocked. Allow camera access and try again.'); });
  },60);
}
function stopScan(){
  if(SCANLOOP){ clearInterval(SCANLOOP); SCANLOOP=null; }
  if(STREAM){ STREAM.getTracks().forEach(function(t){ t.stop(); }); STREAM=null; }
  UI.scan=false; render();
}
function matchUnit(t){
  var hit=DB.assets.filter(function(a){
    return (a.code&&a.code.toLowerCase()===t.toLowerCase()) || (a.serial&&a.serial.toLowerCase()===t.toLowerCase());
  })[0];
  if(hit){ UI.view=hit.id; UI.tab='assets'; render(); }
  else { UI.code=t; UI.tab='assets'; render(); toast('No unit matches '+t); }
}

var TOASTT=null;
function toast(msg){
  UI.toast=msg; render();
  if(TOASTT) clearTimeout(TOASTT);
  TOASTT=setTimeout(function(){ UI.toast=null; render(); },3500);
}

function searchResults(){
  var q=(UI.q2||'').trim().toLowerCase();
  if(q.length<2) return '<div class="card empty">Type at least two characters. Searches unit names, tags, serial numbers, part numbers, job titles and stock.</div>';
  var hit=function(){ for(var i=0;i<arguments.length;i++){ var v=arguments[i];
    if(v&&String(v).toLowerCase().indexOf(q)>=0) return true; } return false; };
  var out='', n=0;

  var us=DB.assets.filter(function(a){ return hit(a.name,a.code,a.serial,a.model,a.location,
    a.engMake,a.engModel,a.engSerial); });
  if(us.length){ out+='<div class="hdr"><span class="t">Units</span><span class="ln"></span></div><div class="card">'+
    us.map(function(a){ var sc=sectorColor(sector(a.sectorId));
      return '<div class="sres row" data-act="open-asset" data-id="'+a.id+'" style="gap:10px">'+unitBadge(a,sc)+
        '<div class="grow"><div class="name">'+esc(a.name)+'</div>'+
        '<div class="mono" style="color:var(--sub);margin-top:3px">'+esc(a.code||'-')+
        (a.serial?' &middot; SN '+esc(a.serial):'')+
        (a.engMake||a.engModel?'</div><div class="mono" style="color:var(--accent);margin-top:3px">'+
          esc(a.engMake||'')+' '+esc(a.engModel||'')+(a.engSerial?' &middot; ESN '+esc(a.engSerial):''):'')+
        '</div></div></div>'; }).join('')+'</div>'; n+=us.length; }

  var cs=DB.comps.filter(function(c){ return hit(c.name,c.pn,c.serial); });
  if(cs.length){ out+='<div class="hdr"><span class="t">Sub-parts</span><span class="ln"></span></div><div class="card">'+
    cs.map(function(c){ var pa=asset(c.assetId);
      return '<div class="sres" data-act="sheet" data-t="comp-detail" data-id="'+c.id+'">'+
        '<div class="name">'+esc(c.name)+'</div><div class="mono" style="color:var(--sub);margin-top:3px">PN '+
        esc(c.pn||'-')+' &middot; '+esc(pa?pa.name:'-')+'</div></div>'; }).join('')+'</div>'; n+=cs.length; }

  var ws=DB.wos.filter(function(w){ return hit(w.title,w.notes); }).slice(0,25);
  if(ws.length){ out+='<div class="hdr"><span class="t">Jobs</span><span class="ln"></span></div>'+
    ws.map(function(w){ return woRow(w,false); }).join(''); n+=ws.length; }

  var ds=DB.drs.filter(function(r){ return hit(r.title,r.work,r.crew); }).slice(0,25);
  if(ds.length){ out+='<div class="hdr"><span class="t">Daily reports</span><span class="ln"></span></div><div class="card">'+
    ds.map(function(r){ var ra=asset(r.assetId);
      return '<div class="sres" data-act="sheet" data-t="dr" data-id="'+r.id+'">'+
        '<div class="name">'+esc(r.title||'Daily report')+'</div>'+
        '<div class="mono" style="color:var(--sub);margin-top:3px">'+esc(r.date||'')+' &middot; '+
        esc(ra?ra.name:'-')+'</div></div>'; }).join('')+'</div>'; n+=ds.length; }

  var ps=DB.parts.filter(function(p){ return hit(p.name,p.pn,p.location); });
  if(ps.length){ out+='<div class="hdr"><span class="t">Stock</span><span class="ln"></span></div><div class="card">'+
    ps.map(function(p){ return '<div class="sres row" data-act="sheet" data-t="part" data-id="'+p.id+'">'+
      '<div class="grow"><div class="name">'+esc(p.name)+'</div>'+
      '<div class="mono" style="color:var(--sub);margin-top:3px">'+esc(p.pn||'no PN')+'</div></div>'+
      '<div class="mono">'+num(p.qty)+'</div></div>'; }).join('')+'</div>'; n+=ps.length; }

  if(!n) return '<div class="card empty">Nothing matches that.</div>';
  return out;
}

        '<div class="meter" style="margin-top:6px"><i style="width:'+pct+'%;background:'+(od?'var(--rust)':st.c)+'"></i></div>'+

      var late=DB.wos.filter(function(w){ return w.assetId===a.id&&woLate(w); }).length;
      var pmo=DB.pms.filter(function(p){ return p.assetId===a.id; }).some(function(p){ return pmStatus(p,a).overdue; });
      var src=firstPhoto(a);
      return '<div class="favcard" style="border-top:4px solid '+sc+'" data-act="open-asset" data-id="'+a.id+'">'+

  if(f==='all'||f==='late'){

  if(!n){
    body='<div class="card empty">'+
      (DB.assets.length?'Nothing waiting under this filter.':'No units yet. Add a fleet first, then the units inside it.')+
      (DB.sectors.length===0
        ? '<div style="margin-top:12px"><button class="btn solid" data-act="sheet" data-t="sector">Add fleet</button> '+
          '<button class="btn" data-act="starter">Use starter fleets</button></div>'

      '</div>';

      (pct>80?'<div class="lbl" style="margin-top:8px;color:var(--rust)">Nearly full. Back up, then delete old photos.</div>':'')+'</div>';

function woRow(w,hideAsset){

  var col = w.status==='closed'?'var(--line)': w.priority==='high'?'var(--rust)': w.priority==='med'?'var(--amber)':'var(--accent)';

  return '<div class="card row" data-act="wo-detail" data-id="'+w.id+'" style="cursor:pointer">'+
    '<div class="stripe '+(late?'hazard':'')+'" style="'+(late?'':'background:'+col)+'"></div>'+

    (late?'<div class="mono late" style="margin-bottom:4px">LATE BY '+lateDays(w)+' DAYS</div>':'')+
    '<div class="name" style="'+(w.status==='closed'?'color:var(--sub)':'')+'">'+esc(w.title)+'</div>'+

  if(act==='tool-add'){
    var tw=byId(DB.wos,id); if(!tw) return;
    var tn=val('f_tool').trim(); if(!tn) return;
    tw.tools=(tw.tools||[]).concat([{name:tn,done:false}]);
    UI.tools=true; save(); return;
  }
  if(act==='tool-tog'){
    var tw2=byId(DB.wos,id), ti=parseInt(el.getAttribute('data-i'),10);
    if(tw2&&tw2.tools&&tw2.tools[ti]){ tw2.tools[ti].done=!tw2.tools[ti].done; UI.tools=true; save(); } return;
  }
  if(act==='tool-del'){
    var tw3=byId(DB.wos,id), ti2=parseInt(el.getAttribute('data-i'),10);
    if(tw3&&tw3.tools){ tw3.tools.splice(ti2,1); UI.tools=true; save(); } return;
  }
  if(act==='close-wo'){
    var w2=byId(DB.wos,id); if(!w2) return;
    var cc=w2.chk||{}, miss=0; CHK.forEach(function(x){ if(!cc[x.k]) miss++; });
    w2.status='closed'; w2.closed=today(); UI.sheet=null; UI.tools=false; save();
    if(miss) toast('Closed, but '+miss+' item(s) on the start checklist were never ticked.');
    return;
  }
  if(act==='reopen-wo'){ var w3=byId(DB.wos,id); w3.status='open'; w3.closed=''; save(); return; }
  if(act==='del-wo'){ var dw=byId(DB.wos,id); if(dw&&dw.photos) dw.photos.forEach(dropImage);
    DB.wos=DB.wos.filter(function(x){return x.id!==id;}); UI.sheet=null; UI.armed=null; save(); return; }
  if(act==='issue-part'){
    var w4=byId(DB.wos,id), p4=part(val('f_pid')), q4=num(val('f_pqty'));
    if(w4&&p4&&q4>0){ p4.qty=num(p4.qty)-q4; w4.parts=(w4.parts||[]).concat([{partId:p4.id,qty:q4}]); save(); }
    return;
  }
  if(act==='return-part'){
    var w5=byId(DB.wos,id), i5=parseInt(el.getAttribute('data-i'),10), ln=(w5.parts||[])[i5];
    if(ln){ var p5=part(ln.partId); if(p5) p5.qty=num(p5.qty)+num(ln.qty); w5.parts.splice(i5,1); save(); }
    return;
  }

  if(act==='save-pm'){
    var pm=currentPmDraft(); if(!String(pm.task).trim()) return;
    pm.every=num(pm.every); pm.lastMeter=num(pm.lastMeter);
    if(UI.sheet.id){ var op=byId(DB.pms,UI.sheet.id); for(var k6 in pm) op[k6]=pm[k6]; }
    else { pm.id=uid(); DB.pms.push(pm); }
    UI.sheet=null; UI.draft=null; save(); return;
  }
  if(act==='set-basis'){ UI.draft=currentPmDraft(); UI.draft.basis=v; render(); return; }
  if(act==='del-pm'){ DB.pms=DB.pms.filter(function(x){return x.id!==id;}); UI.armed=null; save(); return; }
  if(act==='pm-done'){
    var pm2=byId(DB.pms,id); if(!pm2) return;
    var a6=asset(pm2.assetId)||{};
    DB.wos.push({id:uid(),assetId:pm2.assetId,title:pm2.task,kind:'pm',priority:'med',status:'closed',
      created:today(),closed:today(),notes:'Done at '+num(a6.meter)+' '+meterUnit(a6),parts:[]});
    pm2.lastDate=today(); pm2.lastMeter=num(a6.meter); save(); return;
  }

  if(act==='save-part'){
    var p6={name:val('f_name').trim(),pn:val('f_pn'),qty:num(val('f_qty')),min:num(val('f_min')),
      unit:val('f_unit'),location:val('f_location')};
    if(!p6.name) return;
    if(UI.sheet.id){ var op6=part(UI.sheet.id); for(var k7 in p6) op6[k7]=p6[k7]; }
    else { p6.id=uid(); DB.parts.push(p6); }
    UI.sheet=null; save(); return;
  }
  if(act==='qty'){ var p7=part(id); if(p7){ p7.qty=num(p7.qty)+num(v); save(); } return; }
  if(act==='del-part'){ DB.parts=DB.parts.filter(function(x){return x.id!==id;}); UI.armed=null; save(); return; }
});

document.addEventListener('change',function(ev){
  if(ev.target.id==='f_meterType'){ UI.draft=currentAssetDraft(); render(); }
  if(ev.target.id==='f_assetId' && UI.sheet && UI.sheet.type==='wo'){
    UI.draft=currentWoDraft(); UI.draft.compId=''; render();
  }
  if(ev.target.id==='cam'){
    var file=ev.target.files&&ev.target.files[0]; if(!file) return;
    if(PENDING&&PENDING.target==='doc-asset'){
      var aid0=PENDING.id;
      compress(file,function(data){ saveDoc(aid0,'Drawing '+today()+'.jpg','image/jpeg',data); },1800,0.8);
      return;
    }
    if(PENDING&&PENDING.decode) readCode(file);
    compress(file,function(data){
      var pid=uid();
      if(putImage(pid,data)) attachPhoto(pid);
    });
  }
  if(ev.target.id==='restorein'){
    var rf=ev.target.files&&ev.target.files[0]; if(!rf) return;
    var frr=new FileReader();
    frr.onload=function(){
      try{
        var o=JSON.parse(frr.result);
        var d=o.data||o;
        if(!d||!d.assets) throw new Error('bad file');
        DB={sectors:d.sectors||[],groups:d.groups||[],assets:d.assets||[],comps:d.comps||[],
            wos:d.wos||[],drs:d.drs||[],pms:d.pms||[],parts:d.parts||[],rems:d.rems||[],meta:d.meta||{}};
        var im=o.images||{}; Object.keys(im).forEach(function(k){ putImage(k,im[k]); });
        var dc=o.docs||{}; Object.keys(dc).forEach(function(k){ docPut(k,dc[k]); });
        UI.sheet=null; UI.view=null; save();
        toast('Restored '+DB.assets.length+' units.');
      }catch(e){ toast('That is not a valid backup file.'); }
    };
    frr.onerror=function(){ toast('Could not read the file.'); };
    frr.readAsText(rf);
    return;
  }
  if(ev.target.id==='docin'){
    var df=ev.target.files&&ev.target.files[0]; if(!df) return;
    var aid=PENDING&&PENDING.id;
    if(df.size>25*1048576){ toast('That file is over 25 MB. Split it or reduce it first.'); return; }
    if(df.type.indexOf('image')===0){
      compress(df,function(data){ saveDoc(aid,df.name,'image/jpeg',data); },1800,0.8);
    }else{
      var fr=new FileReader();
      fr.onload=function(){ saveDoc(aid,df.name,df.type||'application/pdf',fr.result); };
      fr.onerror=function(){ toast('Could not read that file.'); };
      fr.readAsDataURL(df);
    }
  }
});

function download(name,text,mime){
  var blob=new Blob([text],{type:mime||'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  toast('Saved to your Downloads folder: '+name);
}

function photoBlock(ids){
  ids=(ids||[]).filter(function(i){ return IMG[i]; });
  if(!ids.length) return '';
  return '<div class="ph">'+ids.map(function(i){ return '<img src="'+IMG[i]+'">'; }).join('')+'</div>';
}

function unitReport(a){
  var scr=sectorColor(sector(a.sectorId));
  var h='<h2 style="background:'+scr+'">'+esc(a.name)+'</h2><table class="kv">'+
    '<tr><td>Fleet</td><td>'+esc((sector(a.sectorId)||{}).name||'-')+'</td></tr>'+
    '<tr><td>Rig / site</td><td>'+esc((group(a.groupId)||{}).name||'-')+'</td></tr>'+
    '<tr><td>Tag</td><td>'+esc(a.code||'-')+'</td></tr>'+
    '<tr><td>Model</td><td>'+esc(a.model||'-')+'</td></tr>'+
    '<tr><td>Serial</td><td>'+esc(a.serial||'-')+'</td></tr>'+
    '<tr><td>Engine</td><td>'+esc(((a.engMake||'')+' '+(a.engModel||'')).trim()||'-')+'</td></tr>'+
    '<tr><td>Engine serial</td><td>'+esc(a.engSerial||'-')+'</td></tr>'+
    (a.engPower?'<tr><td>Rating</td><td>'+esc(a.engPower)+'</td></tr>':'')+
    '<tr><td>Location</td><td>'+esc(a.location||'-')+'</td></tr>'+
    '<tr><td>Status</td><td>'+esc(a.status||'-')+'</td></tr>'+
    (a.meterType!=='none'?'<tr><td>Reading</td><td>'+num(a.meter)+' '+meterUnit(a)+'</td></tr>':'')+
    '</table>'+photoBlock(a.photos);

  if((a.docs||[]).length){
    h+='<h3>Documents on file</h3><table class="grid"><tr><th>Name</th><th>Type</th><th>Size</th><th>Added</th></tr>'+
      a.docs.map(function(dc){ return '<tr><td>'+esc(dc.name)+'</td><td>'+
        ((dc.mime||'').indexOf('pdf')>=0?'PDF':'image')+'</td><td>'+humanSize(dc.size)+'</td><td>'+esc(dc.added||'')+'</td></tr>'; }).join('')+
      '</table><p class="muted">Files stay on the phone; they are not embedded in this report.</p>';
  }
  var cps=compsOf(a.id);
  if(cps.length){
    h+='<h3>Sub-parts</h3><table class="grid"><tr><th>Name</th><th>PN</th><th>Serial</th><th>Notes</th></tr>'+
      cps.map(function(c){ return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.pn||'-')+'</td><td>'+
        esc(c.serial||'-')+'</td><td>'+esc(c.notes||'')+'</td></tr>'; }).join('')+'</table>'+
      cps.map(function(c){ return (c.photos||[]).length?'<p class="cap">'+esc(c.name)+'</p>'+photoBlock(c.photos):''; }).join('');
  }

  var wos=DB.wos.filter(function(w){ return w.assetId===a.id; })
    .sort(function(x,y){ return String(y.created).localeCompare(String(x.created)); });
  h+='<h3>WO &mdash; work orders ('+wos.length+')</h3>';
  if(!wos.length) h+='<p class="muted">None.</p>';
  wos.forEach(function(w){
    var pl=(w.parts||[]).map(function(l){ return esc((part(l.partId)||{}).name||'part')+' x'+l.qty; }).join(', ');
    h+='<div class="rec"><div class="rh">'+esc(w.title)+' <span class="badge '+(w.status==='open'?'open':'')+'">'+
      esc(w.status)+'</span>'+(woLate(w)?' <span class="badge open">late '+lateDays(w)+' d</span>':'')+
      '</div><div class="meta">'+esc(w.kind)+' &middot; '+esc(w.priority)+' priority &middot; opened '+
      esc(w.created||'-')+(w.due?' &middot; promised '+esc(w.due):'')+(w.closed?' &middot; closed '+esc(w.closed):'')+
      (w.compId&&comp(w.compId)?' &middot; sub-part: '+esc(comp(w.compId).name):'')+'</div>'+
      (w.notes?'<p>'+esc(w.notes)+'</p>':'')+
      (function(){
        var cc=w.chk||{}, names={loto:'Lock out / tag out',overdue:'Overdue work checked',
          faults:'Earlier faults checked',tools:'Tools ready'};
        var got=[],mis=[];
        CHK.forEach(function(x){ (cc[x.k]?got:mis).push(names[x.k]); });
        var tl=(w.tools||[]).map(function(t){ return esc(t.name); }).join(', ');
        return '<p class="muted">Start checklist: '+(got.length?got.join(', '):'none ticked')+
          (mis.length?' &mdash; <span class="late">not ticked: '+mis.join(', ')+'</span>':'')+'</p>'+
          (tl?'<p class="muted">Tools: '+tl+'</p>':'');
      })()+
      (pl?'<p class="muted">Parts used: '+pl+'</p>':'')+
      photoBlock(w.photos)+'</div>';
  });

  var drs=drsOf(a.id);
  h+='<h3>DR &mdash; daily reports ('+drs.length+')</h3>';
  if(!drs.length) h+='<p class="muted">None.</p>';
  drs.forEach(function(r){
    h+='<div class="rec"><div class="rh">'+esc(r.date||'')+' &mdash; '+esc(r.title||'Daily report')+'</div>'+
      '<div class="meta">'+(r.hours?esc(r.hours)+' h':'')+(r.crew?' &middot; '+esc(r.crew):'')+
      (r.compId&&comp(r.compId)?' &middot; sub-part: '+esc(comp(r.compId).name):'')+'</div>'+
      (r.work?'<p>'+esc(r.work).replace(/\n/g,'<br>')+'</p>':'')+
      photoBlock(r.photos)+'</div>';
  });

  var pms=DB.pms.filter(function(x){ return x.assetId===a.id; });
  if(pms.length){
    h+='<h3>PM schedule</h3><table class="grid"><tr><th>Task</th><th>Interval</th><th>Next due</th></tr>'+
      pms.map(function(x){ var st=pmStatus(x,a);
        return '<tr><td>'+esc(x.task)+'</td><td>every '+esc(x.every)+' '+(x.basis==='days'?'days':st.unit)+
          '</td><td'+(st.overdue?' class="late"':'')+'>'+esc(st.next)+(st.overdue?' (overdue)':'')+'</td></tr>'; }).join('')+'</table>';
  }
  return h;
}

function shareFile(name,text,mime){
  try{
    if(navigator.share && window.File){
      var f=new File([text],name,{type:mime||'text/html'});
      if(!navigator.canShare || navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).catch(function(){});
        return true;
      }
    }
  }catch(e){}
  return false;
}
function printHtml(html){
  var w=window.open('','_blank');
  if(!w){ toast('Chrome blocked the print window. Allow pop-ups for this site.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} },700);
}
function exportUnit(id){ buildReport(id,'save'); }
function buildReport(id,mode){
  var list = id ? [asset(id)].filter(Boolean) : DB.assets;
  if(!list.length){ toast('Nothing to export yet.'); return; }
  var css='body{font-family:Arial,Helvetica,sans-serif;color:#12181A;margin:0;padding:26px;max-width:900px}'+
    'h1{font-size:20px;border-bottom:3px solid #0F5C6B;padding-bottom:8px}'+
    'h2{font-size:17px;margin-top:34px;background:#1C2326;color:#fff;padding:8px 10px}'+
    'h3{font-size:14px;margin-top:22px;text-transform:uppercase;letter-spacing:.08em;color:#0F5C6B}'+
    'table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}'+
    '.kv td{padding:4px 8px;border-bottom:1px solid #eee}.kv td:first-child{color:#616E73;width:130px}'+
    '.grid th,.grid td{border:1px solid #ddd;padding:6px 8px;text-align:left}.grid th{background:#f2f4f2}'+
    '.rec{border-left:3px solid #CBD1CD;padding:8px 12px;margin:12px 0;page-break-inside:avoid}'+
    '.rh{font-weight:bold;font-size:14px}.meta{color:#616E73;font-size:12px;margin-top:3px}'+
    '.badge{font-size:11px;border:1px solid #616E73;padding:1px 6px;border-radius:2px;color:#616E73}'+
    '.badge.open{border-color:#B4400F;color:#B4400F}'+
    '.ph{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.ph img{max-width:250px;border:1px solid #ddd}'+
    '.muted{color:#616E73;font-size:13px}.cap{font-size:12px;color:#616E73;margin:12px 0 0}'+
    '.late{color:#B4400F;font-weight:bold}'+
    '@media print{h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}';
  var remsHtml='';
  if(!id && activeRems().length){
    remsHtml='<h2>Reminders</h2><table class="grid"><tr><th>Reminder</th><th>Due</th><th>Repeat</th><th>Notes</th></tr>'+
      activeRems().map(function(r){ var od=remLeft(r)<0;
        return '<tr><td>'+esc(r.title)+'</td><td'+(od?' class="late"':'')+'>'+esc(r.due||'-')+(od?' (overdue)':'')+
          '</td><td>'+esc(r.repeat||'once')+'</td><td>'+esc(r.notes||'')+'</td></tr>'; }).join('')+'</table>';
  }
  var title = id ? ('Unit report - '+list[0].name) : 'Maintenance report - all units';
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(title)+
    '</title><style>'+css+'</style></head><body>'+
    (DB.meta.company?'<p style="margin:0 0 4px;font-weight:bold;font-size:15px">'+esc(DB.meta.company)+'</p>':'')+
    '<h1>'+esc(title)+'</h1><p class="muted">Generated '+today()+'</p>'+
    list.map(unitReport).join('')+remsHtml+'</body></html>';
  var nm = id ? ('report-'+String(list[0].code||list[0].name).replace(/[^A-Za-z0-9_-]/g,'_')+'-'+today()+'.html')
              : ('report-all-units-'+today()+'.html');
  if(mode==='print'){ printHtml(html); return; }
  if(mode==='share'){
    if(shareFile(nm,html,'text/html')) return;
    download(nm,html,'text/html');
    toast('Sharing is not available here, so the report was saved to Downloads instead.');
    return;
  }
  download(nm,html,'text/html');
}

function exportCsv(){
  var rows=[['type','fleet','rig_site','unit','tag','sub_part','pn','date','title','status','hours','crew','detail']];
  DB.wos.forEach(function(w){
    var a=asset(w.assetId)||{}, c=comp(w.compId)||{};
    rows.push(['WO',(sector(a.sectorId)||{}).name||'',(group(a.groupId)||{}).name||'',a.name||'',a.code||'',c.name||'',c.pn||'',
      w.created||'',w.title||'',w.status||'','','',(w.notes||'').replace(/\n/g,' ')]);
  });
  DB.drs.forEach(function(r){
    var a=asset(r.assetId)||{}, c=comp(r.compId)||{};
    rows.push(['DR',(sector(a.sectorId)||{}).name||'',(group(a.groupId)||{}).name||'',a.name||'',a.code||'',c.name||'',c.pn||'',
      r.date||'',r.title||'','',r.hours||'',r.crew||'',(r.work||'').replace(/\n/g,' ')]);
  });
  var csv=rows.map(function(r){ return r.map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  download('maintenance-log-'+today()+'.csv','\ufeff'+csv,'text/csv');
}

function doBackup(){
  docAll(function(docs){ finishBackup(docs); });
}
function finishBackup(docs){
  var out={data:DB,images:IMG,docs:docs||{},v:4};
  var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='maintenance-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  toast('Backup saved to your Downloads folder.');
}
