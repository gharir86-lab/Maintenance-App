<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2326">
<title>Maintenance Register</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#E3E6E4; --panel:#fff; --plate:#1C2326; --ink:#12181A; --sub:#616E73;
  --line:#CBD1CD; --accent:#0F5C6B; --rust:#B4400F; --ok:#2E7D4F; --amber:#9A6B00;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.bar{background:var(--plate);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.bar h1{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.bar .sub{color:#8FA3A9}
.wrap{padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
.pad{padding:12px}
.lbl,.sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.mono{font-family:var(--mono);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.stripe{width:6px;border-radius:3px 0 0 3px;flex-shrink:0}
.hazard{background:repeating-linear-gradient(135deg,var(--rust) 0 6px,var(--plate) 6px 12px)}
.name{font-weight:600;font-size:14px}
.big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
button{font-family:inherit}
.btn{padding:11px 14px;border-radius:3px;cursor:pointer;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;
  justify-content:center;gap:6px}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dark{background:var(--plate);color:#fff;border-color:var(--plate)}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.btn.full{width:100%}
.chip{padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
.chip.on{background:var(--plate);color:#fff;border-color:var(--plate)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid currentColor}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.field{margin-bottom:12px}
.sect{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.sect .rule{flex:1;height:1px;background:var(--line)}
.sect .nm{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--plate);display:flex;
  border-top:3px solid var(--accent);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:#8A979C;padding:9px 0 12px;display:flex;
  flex-direction:column;align-items:center;gap:3px;font-size:9px;font-family:var(--mono);
  letter-spacing:.06em;cursor:pointer}
nav button.on{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(18,24,26,.55);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-top:4px solid var(--accent)}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:14px}
.warn{background:#FFF4E0;border:1px solid var(--amber);color:var(--amber);padding:10px 12px;
  font-size:12px;border-radius:3px;margin-bottom:12px}
svg{flex-shrink:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:74px;height:74px;border-radius:3px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:#fff}
.lightbox{position:fixed;inset:0;background:rgba(10,14,15,.94);z-index:80;display:flex;flex-direction:column}
.lightbox img{flex:1;object-fit:contain;min-height:0;width:100%}
.lbbar{display:flex;gap:8px;padding:12px;justify-content:space-between;align-items:center}
.toast{position:fixed;left:12px;right:12px;bottom:96px;background:var(--plate);color:#fff;
  padding:12px 14px;border-radius:4px;z-index:90;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.scanbar{background:#0F5C6B;color:#fff;padding:10px 12px;border-radius:3px;margin-bottom:12px;font-size:13px}
.scanbar .mono{color:#BFE3EA}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
video{width:100%;background:#000;border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------ data */
var KEY='maint_v1';
var DB={sectors:[],assets:[],wos:[],pms:[],parts:[]};
var UI={tab:'home',view:null,sheet:null,draft:null,filter:'open',q:'',armed:null,noStore:false};

function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw);
    DB={sectors:o.sectors||[],assets:o.assets||[],wos:o.wos||[],pms:o.pms||[],parts:o.parts||[]}; } }
  catch(e){ UI.noStore=true; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ UI.noStore=true; } render(); }

/* --------------------------------------------------------------- helpers */
function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
function addDays(d,n){ return new Date(new Date(d).getTime()+n*86400000).toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function asset(id){ return byId(DB.assets,id); }
function sector(id){ return byId(DB.sectors,id); }
function part(id){ return byId(DB.parts,id); }
function meterUnit(a){ return a && a.meterType==='km' ? 'km' : 'h'; }

function pmStatus(pm,a){
  if(pm.basis==='days'){
    var next=addDays(pm.lastDate||today(),num(pm.every));
    var left=dayDiff(today(),next);
    return {next:next,left:left,unit:'d',overdue:left<0,soon:left>=0&&left<=Math.max(2,num(pm.every)*0.15)};
  }
  var nx=num(pm.lastMeter)+num(pm.every);
  var lf=nx-num(a&&a.meter);
  var u=meterUnit(a);
  return {next:nx+' '+u,left:lf,unit:u,overdue:lf<0,soon:lf>=0&&lf<=num(pm.every)*0.15};
}
function duePms(){
  return DB.pms.map(function(p){ return {pm:p,st:pmStatus(p,asset(p.assetId))}; })
    .filter(function(x){ return x.st.overdue||x.st.soon; })
    .sort(function(a,b){ return a.st.left-b.st.left; });
}
function openWos(){ return DB.wos.filter(function(w){ return w.status==='open'; }); }
function lowParts(){ return DB.parts.filter(function(p){ return num(p.qty)<=num(p.min); }); }

/* ---------------------------------------------------------------- photos */
var IMG={};                 /* id -> dataURL, held in memory */
var IMGP='maint_img_';
var PENDING=null;           /* {target, id, decode} */
var CANQR = (typeof window.BarcodeDetector !== 'undefined');
var CANLIVE = CANQR && window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;

function loadImages(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf(IMGP)===0) IMG[k.slice(IMGP.length)]=localStorage.getItem(k);
    }
  }catch(e){}
}
function putImage(id,data){
  IMG[id]=data;
  try{ localStorage.setItem(IMGP+id,data); return true; }
  catch(e){ delete IMG[id]; toast('Storage is full. Delete some photos or take a backup, then try again.'); return false; }
}
function dropImage(id){ delete IMG[id]; try{ localStorage.removeItem(IMGP+id); }catch(e){} }
function imgBytes(){ var n=0; for(var k in IMG) n+=IMG[k].length; return n; }

function compress(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=900, s=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      try{ cb(c.toDataURL('image/jpeg',0.6)); }catch(e){ cb(r.result); }
    };
    im.onerror=function(){ cb(r.result); };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

var CANCAM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
var CAMSTREAM=null;

function shoot(target,id,decode){
  PENDING={target:target,id:id,decode:!!decode};
  if(CANCAM){ UI.cam=true; render(); setTimeout(initCam,60); return; }
  pickFile();
}
function pickFile(){ var inp=document.getElementById('cam'); if(inp){ inp.value=''; inp.click(); } }

function initCam(){
  var v=document.getElementById('camvid'); if(!v) return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(st){
    CAMSTREAM=st; v.srcObject=st; v.play();
  }).catch(function(e){
    closeCam();
    toast('In-app camera refused ('+((e&&e.name)||'unknown')+'). Opening the phone camera instead.');
    setTimeout(pickFile,120);
  });
}
function closeCam(){
  if(CAMSTREAM){ CAMSTREAM.getTracks().forEach(function(t){ t.stop(); }); CAMSTREAM=null; }
  UI.cam=false; render();
}
function snap(){
  var v=document.getElementById('camvid'); if(!v||!v.videoWidth) return;
  var max=900, sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
  var c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  var data=c.toDataURL('image/jpeg',0.6);
  if(PENDING&&PENDING.decode&&CANQR){
    try{
      new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']})
        .detect(c).then(function(res){ if(res&&res.length){ UI.code=res[0].rawValue; render(); } }).catch(function(){});
    }catch(e){}
  }
  closeCam();
  var pid=uid();
  if(putImage(pid,data)) attachPhoto(pid);
}

function attachPhoto(pid){
  var t=PENDING||{};
  if(t.target==='asset'){ var a=asset(t.id); if(a){ a.photos=(a.photos||[]).concat([pid]); } save(); }
  else if(t.target==='wo'){ var w=byId(DB.wos,t.id); if(w){ w.photos=(w.photos||[]).concat([pid]); } save(); }
  else if(t.target==='draft-asset'){ UI.draft=currentAssetDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else if(t.target==='draft-wo'){ UI.draft=currentWoDraft(); UI.draft.photos=(UI.draft.photos||[]).concat([pid]); render(); }
  else render();
}

function readCode(file){
  if(!CANQR) return;
  try{
    var det=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']});
    createImageBitmap(file).then(function(bmp){
      return det.detect(bmp);
    }).then(function(res){
      if(res && res.length){ UI.code=res[0].rawValue; render(); }
      else toast('No code found in that photo. Fill the frame with the label and try again.');
    }).catch(function(){});
  }catch(e){}
}

function applyCode(where){
  var txt=UI.code; if(!txt) return;
  if(UI.sheet && (UI.sheet.type==='asset')){
    UI.draft=currentAssetDraft(); UI.draft[where]=txt; UI.code=null; render(); return;
  }
  var a=asset(UI.view); if(a){ a[where]=txt; UI.code=null; save(); }
}

/* live scanner (needs https) */
var STREAM=null,SCANLOOP=null;
function startScan(){
  UI.scan=true; render();
  setTimeout(function(){
    var v=document.getElementById('vid'); if(!v) return;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
      STREAM=st; v.srcObject=st; v.play();
      var det=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13']});
      SCANLOOP=setInterval(function(){
        det.detect(v).then(function(res){
          if(res&&res.length){ var t=res[0].rawValue; stopScan(); matchUnit(t); }
        }).catch(function(){});
      },400);
    }).catch(function(){ stopScan(); toast('Camera blocked. Allow camera access and try again.'); });
  },60);
}
function stopScan(){
  if(SCANLOOP){ clearInterval(SCANLOOP); SCANLOOP=null; }
  if(STREAM){ STREAM.getTracks().forEach(function(t){ t.stop(); }); STREAM=null; }
  UI.scan=false; render();
}
function matchUnit(t){
  var hit=DB.assets.filter(function(a){
    return (a.code&&a.code.toLowerCase()===t.toLowerCase()) || (a.serial&&a.serial.toLowerCase()===t.toLowerCase());
  })[0];
  if(hit){ UI.view=hit.id; UI.tab='assets'; render(); }
  else { UI.code=t; UI.tab='assets'; render(); toast('No unit matches '+t); }
}

var TOASTT=null;
function toast(msg){
  UI.toast=msg; render();
  if(TOASTT) clearTimeout(TOASTT);
  TOASTT=setTimeout(function(){ UI.toast=null; render(); },3500);
}

/* ----------------------------------------------------------------- icons */
var IC={
 home:'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5', box:'M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7',
 clip:'M9 3h6v3H9zM7 5H5v16h14V5h-2M9 11h6M9 15h4', cal:'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',
 pack:'M4 8h16v12H4zM4 8l2-4h12l2 4M12 8v12', plus:'M12 5v14M5 12h14', left:'M15 5l-7 7 7 7',
 x:'M6 6l12 12M18 6L6 18', check:'M4 12l5 6L20 6', trash:'M4 7h16M9 7V4h6v3M7 7v13h10V7',
 pen:'M4 20l4-1 11-11-3-3L5 16z', search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
 warn:'M12 4l9 16H3zM12 10v4',
 cam:'M3 8h4l2-3h6l2 3h4v12H3zM12 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
 qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z'};
function ico(k,size,color){
  return '<svg width="'+(size||18)+'" height="'+(size||18)+'" viewBox="0 0 24 24" fill="none" stroke="'+
    (color||'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[k]+'"/></svg>';
}

/* --------------------------------------------------------------- widgets */
function field(id,label,value,type,ph){
  return '<div class="field"><div class="lbl" style="margin-bottom:5px">'+esc(label)+'</div>'+
    '<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value)+'" placeholder="'+esc(ph||'')+'"></div>';
}
function pick(id,label,value,opts){
  var o=opts.map(function(x){ return '<option value="'+esc(x.v)+'"'+(x.v===value?' selected':'')+'>'+esc(x.t)+'</option>'; }).join('');
  return '<div class="field"><div class="lbl" style="margin-bottom:5px">'+esc(label)+'</div>'+
    '<select id="'+id+'">'+o+'</select></div>';
}
function chips(act,value,opts){
  return '<div class="row" style="flex-wrap:wrap;gap:6px">'+opts.map(function(x){
    return '<button class="chip'+(x.v===value?' on':'')+'" data-act="'+act+'" data-v="'+esc(x.v)+'">'+esc(x.t)+'</button>';
  }).join('')+'</div>';
}
function thumbs(ids){
  ids=ids||[];
  if(!ids.length) return '';
  return '<div class="thumbs">'+ids.map(function(id){
    return IMG[id] ? '<img class="thumb" src="'+IMG[id]+'" data-act="zoom" data-id="'+id+'">' : '';
  }).join('')+'</div>';
}
function delBtn(act,id,label){
  var armed=UI.armed===act+':'+id;
  return '<button class="btn sm danger" data-act="'+(armed?act:'arm')+'" data-id="'+id+'" data-key="'+act+':'+id+'">'+
    (armed?'Tap again to confirm':(ico('trash',13)+' '+(label||'Delete')))+'</button>';
}

/* --------------------------------------------------------------- screens */
function vHome(){
  var s=[{n:openWos().length,t:'Open jobs',go:'work',c:'var(--accent)'},
         {n:duePms().filter(function(x){return x.st.overdue;}).length,t:'PM overdue',go:'pm',c:'var(--rust)'},
         {n:lowParts().length,t:'Low stock',go:'parts',c:'var(--amber)'}];
  var h='<div class="wrap">';
  if(UI.noStore) h+='<div class="warn">This browser is blocking local storage, so nothing will be kept when you close the page. Use Export to save a backup file.</div>';
  h+='<div class="row" style="gap:8px;margin-bottom:14px">'+s.map(function(x){
    return '<div class="card" style="flex:1;padding:12px 10px;margin:0;border-top:4px solid '+x.c+';cursor:pointer" data-act="tab" data-v="'+x.go+'">'+
      '<div class="big" style="color:'+x.c+'">'+x.n+'</div><div class="lbl" style="margin-top:6px">'+x.t+'</div></div>';
  }).join('')+'</div>';

  var nph=0; for(var _k in IMG) nph++;
  if(nph){
    var mb=imgBytes()/1048576, pct=Math.min(100,Math.round(mb/4.5*100));
    h+='<div class="card pad" style="margin-bottom:14px"><div class="row"><div class="grow lbl">Photo storage</div>'+
      '<div class="mono" style="color:'+(pct>80?'var(--rust)':'var(--sub)')+'">'+nph+' photos &middot; '+mb.toFixed(1)+' MB</div></div>'+
      '<div class="meter"><i style="width:'+pct+'%;background:'+(pct>80?'var(--rust)':'var(--accent)')+'"></i></div>'+
      (pct>80?'<div class="lbl" style="margin-top:8px;color:var(--rust)">Nearly full. Back up, then delete old photos.</div>':'')+'</div>';
  }
  h+='<div class="card pad" style="margin-bottom:14px"><div class="row">'+
    '<div class="grow lbl">Camera and scanner</div>'+
    '<button class="btn sm" data-act="diag">'+(UI.diag?'Hide':'Check')+'</button></div>';
  if(UI.diag){
    var prot=location.protocol.replace(':','');
    var rows=[
      ['Page address',prot+'://'],
      ['Secure page',window.isSecureContext?'yes':'no'],
      ['In-app camera',CANCAM?'available':'blocked'],
      ['Photo from camera app','available'],
      ['QR / barcode reading',CANQR?'available':'not supported here']
    ];
    h+='<div style="margin-top:10px">'+rows.map(function(r){
      return '<div class="row" style="padding:4px 0"><div class="grow lbl">'+r[0]+'</div>'+
        '<div class="mono" style="color:'+(r[1]==='no'||r[1]==='blocked'||r[1].indexOf('not')===0?'var(--rust)':'var(--ok)')+'">'+r[1]+'</div></div>';
    }).join('')+'</div>';
    if(prot==='content'||prot==='file') h+='<div class="lbl" style="margin-top:8px;line-height:1.5;color:var(--rust)">'+
      'Opened straight from Downloads. Chrome gives this page no identity, so it refuses camera permission and may erase saved data. '+
      'Serve the file from a web address to fix both.</div>';
    if(!window.isSecureContext) h+='<div class="lbl" style="margin-top:8px;line-height:1.5;color:var(--sub)">'+
      'Opened as a local file, so Chrome blocks the live camera and the barcode reader. The photo buttons still work &mdash; they hand you to the phone camera app. Serve this file over https to unlock the rest.</div>';
  }
  h+='</div>';
  h+='<div class="lbl" style="margin-bottom:5px">Needs attention</div>';
  var dp=duePms(), ow=openWos(), lp=lowParts();
  if(!dp.length && !ow.length && !lp.length){
    h+='<div class="card empty">'+(DB.assets.length?'Nothing due. All units are clear.':'No units yet. Add a sector first, then the units inside it.')+
      '<div style="margin-top:12px" class="row" style="justify-content:center">'+
      (DB.sectors.length===0
        ? '<button class="btn solid" data-act="sheet" data-t="sector">Add sector</button> <button class="btn" data-act="starter">Use starter sectors</button>'
        : '<button class="btn solid" data-act="sheet" data-t="asset">Add unit</button>')+'</div></div>';
  }
  dp.forEach(function(x){
    var a=asset(x.pm.assetId);
    h+='<div class="card row"><div class="stripe '+(x.st.overdue?'hazard':'')+'" style="'+(x.st.overdue?'':'background:var(--amber)')+'"></div>'+
      '<div class="pad grow"><div class="name">'+esc(x.pm.task)+'</div>'+
      '<div class="lbl" style="margin-top:4px">'+esc(a?a.name:'unit removed')+'</div>'+
      '<div class="mono" style="margin-top:6px;color:'+(x.st.overdue?'var(--rust)':'var(--amber)')+'">'+
      (x.st.overdue?'OVERDUE BY '+Math.abs(x.st.left)+' '+x.st.unit:'DUE IN '+x.st.left+' '+x.st.unit)+'</div></div>'+
      '<div class="pad"><button class="btn sm dark" data-act="pm-done" data-id="'+x.pm.id+'">'+ico('check',13)+' Done</button></div></div>';
  });
  ow.filter(function(w){return w.priority==='high';}).forEach(function(w){ h+=woRow(w,false); });
  lp.forEach(function(p){
    h+='<div class="card pad row">'+ico('warn',16,'var(--amber)')+

  if(s.type==='part'){
    var cur6=s.id?part(s.id):null;
    var f6=cur6||{name:'',pn:'',qty:0,min:1,unit:'pcs',location:''};
    var b6=field('f_name','Part name',f6.name,'text','Fuel filter')+
      field('f_pn','Part number',f6.pn)+
      field('f_qty','Quantity in stock',num(f6.qty),'number')+
      field('f_min','Reorder level',num(f6.min),'number')+
      field('f_unit','Unit',f6.unit,'text','pcs, L, m')+
      field('f_location','Shelf / location',f6.location)+
      '<button class="btn solid full" data-act="save-part">Save part</button>';
    return sheetWrap(s.id?'Edit part':'New part',b6);
  }
  return '';
}

/* ----------------------------------------------------------------- shell */
var TABS=[{k:'home',t:'Overview',i:'home'},{k:'assets',t:'Units',i:'box'},
  {k:'work',t:'Jobs',i:'clip'},{k:'pm',t:'PM',i:'cal'},{k:'parts',t:'Parts',i:'pack'}];

function render(){
  var body = UI.view ? vAssetDetail(UI.view)
    : UI.tab==='home'?vHome(): UI.tab==='assets'?vAssets()
    : UI.tab==='work'?vWork(): UI.tab==='pm'?vPMs():vParts();
  var t=TABS.filter(function(x){return x.k===UI.tab;})[0]||TABS[0];
  var head='<div class="bar">'+(UI.view?'<button style="background:none;border:none;color:#fff;padding:0" data-act="back">'+ico('left',22)+'</button>':'')+
    '<div class="grow"><h1>'+(UI.view?'Unit detail':esc(t.t))+'</h1>'+
    '<div class="sub" style="margin-top:2px">Maintenance register &middot; '+today()+'</div></div>'+
    '<button class="btn sm" data-act="backup">Backup</button></div>';
  var nav='<nav>'+TABS.map(function(x){
    return '<button class="'+(x.k===UI.tab&&!UI.view?'on':'')+'" data-act="tab" data-v="'+x.k+'">'+
      ico(x.i,19)+x.t.toUpperCase()+'</button>'; }).join('')+'</nav>';
  var extra='';
  if(UI.zoom && IMG[UI.zoom]) extra+='<div class="lightbox"><div class="lbbar">'+
    '<button class="btn sm" data-act="close-zoom">'+ico('x',14)+' Close</button>'+
    '<button class="btn sm danger" data-act="del-photo" data-id="'+UI.zoom+'">'+ico('trash',13)+' Delete photo</button></div>'+
    '<img src="'+IMG[UI.zoom]+'"></div>';
  if(UI.scan) extra+='<div class="lightbox"><div class="lbbar">'+
    '<span class="mono" style="color:#BFE3EA">Point at the QR or barcode</span>'+
    '<button class="btn sm" data-act="stop-scan">Cancel</button></div>'+
    '<div style="padding:12px"><video id="vid" playsinline muted></video></div></div>';
  if(UI.cam) extra+='<div class="lightbox"><div class="lbbar">'+
    '<button class="btn sm" data-act="close-cam">Cancel</button>'+
    '<button class="btn sm" data-act="pick-file">Choose a file instead</button></div>'+
    '<div style="padding:12px"><video id="camvid" playsinline muted></video></div>'+
    '<div class="lbbar" style="justify-content:center"><button class="btn solid" data-act="snap">'+
    ico('cam',16)+' Take the picture</button></div></div>';
  if(UI.toast) extra+='<div class="toast">'+esc(UI.toast)+'</div>';
  document.getElementById('app').innerHTML=head+body+nav+vSheet()+extra+
    '<input id="cam" type="file" accept="image/*" style="display:none">';
}

function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function grab(ids){ var o={}; ids.forEach(function(k){ var e=document.getElementById('f_'+k); if(e) o[k]=e.value; }); return o; }
function capture(base,ids){ var o={}; for(var k in base) o[k]=base[k]; var g=grab(ids); for(var k2 in g) o[k2]=g[k2]; return o; }

var ASSET_F=['sectorId','name','code','model','serial','location','meterType','meter','notes'];
var WO_F=['assetId','title','kind','due','notes'];
var PM_F=['assetId','task','every','lastDate','lastMeter'];

function currentAssetDraft(){
  var s=UI.sheet, cur=s.id?asset(s.id):null;
  var base=UI.draft||cur||{sectorId:(DB.sectors[0]||{}).id||'',name:'',code:'',model:'',serial:'',
    location:'',meterType:'hours',meter:0,status:'running',notes:'',photos:[]};
  return capture(base,ASSET_F);
}
function currentPmDraft(){
  var s=UI.sheet, cur=s.id?byId(DB.pms,s.id):null;
  var base=UI.draft||cur||{assetId:s.aid||(DB.assets[0]||{}).id||'',task:'',basis:'days',every:90,lastDate:today(),lastMeter:0};
  return capture(base,PM_F);
}
function currentWoDraft(){
  var s=UI.sheet, cur=s.id?byId(DB.wos,s.id):null;
  var base=UI.draft||cur||{assetId:s.aid||(DB.assets[0]||{}).id||'',title:'',kind:'fault',priority:'med',
    status:'open',created:today(),due:'',notes:'',parts:[],photos:[]};
  return capture(base,WO_F);
}

function openSheet(type,id,aid){ UI.sheet={type:type,id:id||null,aid:aid||null}; UI.draft=null; UI.armed=null; render(); }
function closeSheet(){ UI.sheet=null; UI.draft=null; UI.armed=null; render(); }

document.addEventListener('click',function(ev){
  var el=ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id'), v=el.getAttribute('data-v');
  if(act==='close-sheet' && el.getAttribute('class')==='scrim' && ev.target!==el) return;

  if(act==='tab'){ UI.tab=v; UI.view=null; UI.armed=null; render(); return; }
  if(act==='back'){ UI.view=null; render(); return; }
  if(act==='open-asset'){ UI.view=id; UI.armed=null; render(); return; }
  if(act==='sheet'){ openSheet(el.getAttribute('data-t'),id,el.getAttribute('data-aid')); return; }
  if(act==='close-sheet'){ closeSheet(); return; }
  if(act==='arm'){ UI.armed=el.getAttribute('data-key'); render(); return; }
  if(act==='starter'){ ['Generators','Vehicles','Coil Tubing'].forEach(function(n){ DB.sectors.push({id:uid(),name:n}); }); save(); return; }
  if(act==='backup'){ doBackup(); return; }
  if(act==='shoot'){ shoot(el.getAttribute('data-t'),id,el.getAttribute('data-qr')); return; }
  if(act==='zoom'){ UI.zoom=id; render(); return; }
  if(act==='close-zoom'){ UI.zoom=null; render(); return; }
  if(act==='del-photo'){
    dropImage(id);
    DB.assets.forEach(function(a){ if(a.photos) a.photos=a.photos.filter(function(x){return x!==id;}); });
    DB.wos.forEach(function(w){ if(w.photos) w.photos=w.photos.filter(function(x){return x!==id;}); });
    UI.zoom=null; save(); return;
  }
  if(act==='use-code'){ applyCode(v); return; }
  if(act==='drop-code'){ UI.code=null; render(); return; }
  if(act==='scan'){ startScan(); return; }
  if(act==='close-cam'){ closeCam(); return; }
  if(act==='snap'){ snap(); return; }
  if(act==='pick-file'){ closeCam(); setTimeout(pickFile,80); return; }
  if(act==='diag'){ UI.diag=!UI.diag; render(); return; }
  if(act==='stop-scan'){ stopScan(); return; }

  if(act==='save-sector'){
    var nm=val('f_name').trim(); if(!nm) return;
    if(UI.sheet.id){ sector(UI.sheet.id).name=nm; } else { DB.sectors.push({id:uid(),name:nm}); }
    UI.sheet=null; UI.draft=null; save(); return;
  }
  if(act==='del-sector'){ DB.sectors=DB.sectors.filter(function(x){return x.id!==id;}); UI.sheet=null; UI.armed=null; save(); return; }

  if(act==='save-asset'){
    var f=currentAssetDraft(); if(!String(f.name).trim()) return;
    f.meter=num(f.meter);
    if(UI.sheet.id){ var a=asset(UI.sheet.id); for(var k in f) a[k]=f[k]; }
    else { f.id=uid(); f.status=f.status||'running'; f.photos=f.photos||[]; DB.assets.push(f); }
    UI.sheet=null; UI.draft=null; save(); return;
  }
  if(act==='del-asset'){
    var da=asset(id); if(da&&da.photos) da.photos.forEach(dropImage);
    DB.assets=DB.assets.filter(function(x){return x.id!==id;});
    DB.pms=DB.pms.filter(function(p){return p.assetId!==id;});
    UI.view=null; UI.armed=null; save(); return;
  }
  if(act==='set-status'){ var a2=asset(UI.view); if(a2){ a2.status=v; save(); } return; }
  if(act==='set-meter'){ var a3=asset(id); if(a3){ a3.meter=num(val('f_meter')); save(); } return; }

  if(act==='save-wo'){
    var w=currentWoDraft(); if(!String(w.title).trim()) return;
    if(UI.sheet.id){ var ow=byId(DB.wos,UI.sheet.id); for(var k3 in w) ow[k3]=w[k3]; }
    else { w.id=uid(); w.photos=w.photos||[]; DB.wos.push(w); }
    UI.sheet=null; UI.draft=null; save(); return;
  }
  if(act==='set-prio'){ UI.draft=currentWoDraft(); UI.draft.priority=v; render(); return; }
  if(act==='set-filter'){ UI.filter=v; render(); return; }
  if(act==='wo-detail'){ openSheet('wo-detail',id); return; }
  if(act==='close-wo'){ var w2=byId(DB.wos,id); w2.status='closed'; w2.closed=today(); UI.sheet=null; save(); return; }
  if(act==='reopen-wo'){ var w3=byId(DB.wos,id); w3.status='open'; w3.closed=''; save(); return; }
  if(act==='del-wo'){ var dw=byId(DB.wos,id); if(dw&&dw.photos) dw.photos.forEach(dropImage);
    DB.wos=DB.wos.filter(function(x){return x.id!==id;}); UI.sheet=null; UI.armed=null; save(); return; }
  if(act==='issue-part'){
    var w4=byId(DB.wos,id), p4=part(val('f_pid')), q4=num(val('f_pqty'));
    if(w4&&p4&&q4>0){ p4.qty=num(p4.qty)-q4; w4.parts=(w4.parts||[]).concat([{partId:p4.id,qty:q4}]); save(); }
    return;
  }
  if(act==='return-part'){
    var w5=byId(DB.wos,id), i5=parseInt(el.getAttribute('data-i'),10), ln=(w5.parts||[])[i5];
    if(ln){ var p5=part(ln.partId); if(p5) p5.qty=num(p5.qty)+num(ln.qty); w5.parts.splice(i5,1); save(); }
    return;
  }

  if(act==='save-pm'){
    var pm=currentPmDraft(); if(!String(pm.task).trim()) return;
    pm.every=num(pm.every); pm.lastMeter=num(pm.lastMeter);
    if(UI.sheet.id){ var op=byId(DB.pms,UI.sheet.id); for(var k6 in pm) op[k6]=pm[k6]; }
    else { pm.id=uid(); DB.pms.push(pm); }
    UI.sheet=null; UI.draft=null; save(); return;
  }
  if(act==='set-basis'){ UI.draft=currentPmDraft(); UI.draft.basis=v; render(); return; }
  if(act==='del-pm'){ DB.pms=DB.pms.filter(function(x){return x.id!==id;}); UI.armed=null; save(); return; }
  if(act==='pm-done'){
    var pm2=byId(DB.pms,id); if(!pm2) return;
    var a6=asset(pm2.assetId)||{};
    DB.wos.push({id:uid(),assetId:pm2.assetId,title:pm2.task,kind:'pm',priority:'med',status:'closed',
      created:today(),closed:today(),notes:'Done at '+num(a6.meter)+' '+meterUnit(a6),parts:[]});
    pm2.lastDate=today(); pm2.lastMeter=num(a6.meter); save(); return;
  }

  if(act==='save-part'){
    var p6={name:val('f_name').trim(),pn:val('f_pn'),qty:num(val('f_qty')),min:num(val('f_min')),
      unit:val('f_unit'),location:val('f_location')};
    if(!p6.name) return;
    if(UI.sheet.id){ var op6=part(UI.sheet.id); for(var k7 in p6) op6[k7]=p6[k7]; }
    else { p6.id=uid(); DB.parts.push(p6); }
    UI.sheet=null; save(); return;
  }
  if(act==='qty'){ var p7=part(id); if(p7){ p7.qty=num(p7.qty)+num(v); save(); } return; }
  if(act==='del-part'){ DB.parts=DB.parts.filter(function(x){return x.id!==id;}); UI.armed=null; save(); return; }
});

document.addEventListener('change',function(ev){
  if(ev.target.id==='f_meterType'){ UI.draft=currentAssetDraft(); render(); }
  if(ev.target.id==='cam'){
    var file=ev.target.files&&ev.target.files[0]; if(!file) return;
    if(PENDING&&PENDING.decode) readCode(file);
    compress(file,function(data){
      var pid=uid();
      if(putImage(pid,data)) attachPhoto(pid);
    });
  }
});

document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){
    UI.q=ev.target.value;
    var box=document.getElementById('partList');
    if(box) box.innerHTML=partList();
  }
});

function doBackup(){
  var out={data:DB,images:IMG,v:2};
  var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='maintenance-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
load(); loadImages(); render();
</script>
